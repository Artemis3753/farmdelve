name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs: 
  fd-build:
    runs-on: ubuntu-24.04
    defaults:
        run:
            working-directory: client
    steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: 26
            cache: npm
            cache-dependency-path: client/package-lock.json
        - run: npm ci
        - run: npm run build
        - run: npm run lint
        - run: npm run test
  fd-server:
    runs-on: ubuntu-24.04
    services:
        postgres:
            image: postgres:17
            ports:
                - 5432:5432
            options: >-
                --health-cmd "pg_isready"
                --health-interval 10s
                --health-timeout 5s
                --health-retries 10
            env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: farmdelve_test
    env:
        PGUSER: postgres
        PGPASSWORD: postgres
        PGHOST: localhost
        PGDATABASE: farmdelve_test
    defaults: 
        run:
            working-directory: server
    steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: 26
            cache: npm
            cache-dependency-path: server/package-lock.json
        - run: npm ci
        - run: npm run build
        - run: psql -v ON_ERROR_STOP=1 -f db/schema.sql
        - run: psql -v ON_ERROR_STOP=1 -f db/seed.sql 
        - run: npm test