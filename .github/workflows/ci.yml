name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs: 
  fd-build:
    runs-on: ubuntu-24.04
    defaults:
        run:
            working-directory: client
    steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: 26
            cache: npm
            cache-dependency-path: client/package-lock.json
        - run: npm ci
        - run: npm run build
        - run: npm run lint
        - run: npm run test
