services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: farmdelve
      POSTGRES_DB: farmdelve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "farmdelve", "-d", "farmdelve"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    image: ghcr.io/artemis3753/farmdelve:latest
    init: true
    environment:
      DATABASE_URL: postgresql://farmdelve:${POSTGRES_PASSWORD}@db:5432/farmdelve
      TIME_SCALE: ${TIME_SCALE:?set TIME_SCALE in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
